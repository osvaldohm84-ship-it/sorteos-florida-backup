name: Robot Sorteos Florida Backup

on:
  schedule:
    # 19:10 UTC (3:10 PM Cuba / 2:10 PM Florida) - 20 min después del Robot 1
    - cron: '10 19 * * *'
    # 03:25 UTC (11:25 PM Cuba / 10:25 PM Florida) - 20 min después del Robot 1
    - cron: '25 3 * * *'
  workflow_dispatch:

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v3

      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Instalar dependencias de Python
        run: pip install requests beautifulsoup4 pandas lxml

      # EJECUTAMOS DIRECTAMENTE EL RESPALDO WEB
      - name: Buscar en Web (LotteryUSA)
        run: python respaldo_web.py

      - name: Guardar cambios (Commit)
        run: |
          git config --global user.name 'Robot Florida Backup'
          git config --global user.email 'robot@github.com'
          git add .
          git commit -m "Actualizacion automatica via Web (Backup)" || exit 0
          git push

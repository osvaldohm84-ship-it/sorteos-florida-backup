name: Robot Sorteos Florida Backup

on:
  schedule:
    # 18:20 UTC (2:20 PM ET) y 02:20 UTC (10:20 PM ET)
    - cron: '20 18,2 * * *'
  workflow_dispatch:

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v3

      - name: Configurar Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Limpiar archivos viejos
        run: |
          rm -f p3_output.txt p4_output.txt

      - name: Ejecutar Scraper (fl-lotto)
        run: |
          npx fl-lotto -g p3 > p3_output.txt
          npx fl-lotto -g p4 > p4_output.txt
          cat p3_output.txt
          cat p4_output.txt

      - name: Convertir a JSON
        run: python scraper.py

      - name: Guardar cambios (Commit)
        run: |
          git config --global user.name 'Robot Florida'
          git config --global user.email 'robot@github.com'
          git add .
          git commit -m "Actualizacion automatica" || exit 0
          git push
